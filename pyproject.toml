[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aicut"
version = "0.1.0"
description = "AI 视频剪辑流水线：素材理解、故事编排、时间线生成与剪映导入"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
aicut = "aicut.cli:main"

[tool.setuptools.packages.find]
include = ["aicut*"]
